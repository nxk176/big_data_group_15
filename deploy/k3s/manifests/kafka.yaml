# One Kafka 4.1.2 process in KRaft mode (broker and controller), the version of deploy/native.
# Two client listeners: INTERNAL for pods (kafka.harbortrace.svc.cluster.local:9092) and
# EXTERNAL for processes on the node, including hostNetwork Spark pods (127.0.0.1:30092).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: harbortrace
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.2
          ports:
            - {name: internal, containerPort: 9092}
            - {name: controller, containerPort: 9093}
            - {name: external, containerPort: 9094}
          env:
            # Kafka requires 16 bytes in base64url (22 characters) for the KRaft cluster ID.
            - {name: CLUSTER_ID, value: "SGFyYm9yVHJhY2VLM3NLYQ"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"}
            - {name: KAFKA_ADVERTISED_LISTENERS,
               value: "INTERNAL://kafka.harbortrace.svc.cluster.local:9092,EXTERNAL://127.0.0.1:30092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
               value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/logs"}
            # Replay topics are created explicitly by the publisher, with unlimited retention.
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_NUM_PARTITIONS, value: "4"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m"}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
          readinessProbe:
            tcpSocket: {port: internal}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: harbortrace
spec:
  selector: {app: kafka}
  ports:
    - {name: internal, port: 9092, targetPort: internal}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-node
  namespace: harbortrace
spec:
  type: NodePort
  selector: {app: kafka}
  ports:
    - {name: external, port: 9094, targetPort: external, nodePort: 30092}
