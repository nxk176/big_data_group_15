# MongoDB 7 with authentication. The root user and the two application users come from the
# mongodb-credentials Secret that deploy.sh creates; the init script runs only on an empty volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: harbortrace
data:
  create-users.js: |
    const name = process.env.HARBORTRACE_DATABASE;
    const app = db.getSiblingDB(name);
    app.createUser({user: process.env.HARBORTRACE_WRITER_USER, pwd: process.env.HARBORTRACE_WRITER_PASSWORD,
                    roles: [{role: "readWrite", db: name}]});
    app.createUser({user: process.env.HARBORTRACE_READER_USER, pwd: process.env.HARBORTRACE_READER_PASSWORD,
                    roles: [{role: "read", db: name}]});
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: harbortrace
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.48
          ports:
            - {name: mongodb, containerPort: 27017}
          envFrom:
            - secretRef: {name: mongodb-credentials}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  exec mongosh --host "$HOSTNAME" --quiet --eval '
                    const app = db.getSiblingDB(process.env.HARBORTRACE_DATABASE);
                    app.auth(process.env.HARBORTRACE_READER_USER, process.env.HARBORTRACE_READER_PASSWORD);
                    app.serving_state.findOne({}, {_id: 1});'
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: init
          configMap: {name: mongodb-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
---
# In-cluster address: mongodb.harbortrace.svc.cluster.local:27017
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: harbortrace
spec:
  selector: {app: mongodb}
  ports:
    - {name: mongodb, port: 27017, targetPort: mongodb}
---
# Address on the node (WSL / VM): 127.0.0.1:30017
apiVersion: v1
kind: Service
metadata:
  name: mongodb-node
  namespace: harbortrace
spec:
  type: NodePort
  selector: {app: mongodb}
  ports:
    - {name: mongodb, port: 27017, targetPort: mongodb, nodePort: 30017}
