# The read-only dashboard from this checkout (@REPO@, mounted read-only from the node) on the public
# python image: an init container installs pymongo, so no project image has to be built.
# It connects with the MongoDB "read" user only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: harbortrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: dependencies
          image: python:3.12-slim-bookworm
          command: ["pip", "install", "--quiet", "--no-cache-dir", "--target", "/deps", "pymongo==4.10.1"]
          volumeMounts:
            - {name: deps, mountPath: /deps}
      containers:
        - name: dashboard
          image: python:3.12-slim-bookworm
          workingDir: /repo
          command: ["python", "scripts/serve_dashboard.py", "--host", "0.0.0.0", "--port", "8050",
                    "--database", "$(HARBORTRACE_DATABASE)"]
          env:
            - {name: PYTHONPATH, value: /deps}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: HARBORTRACE_DATABASE
              valueFrom: {secretKeyRef: {name: mongodb-credentials, key: HARBORTRACE_DATABASE}}
            - name: HARBORTRACE_MONGO_READER_URI
              valueFrom: {secretKeyRef: {name: mongodb-credentials, key: HARBORTRACE_READER_URI_CLUSTER}}
          ports:
            - {name: http, containerPort: 8050}
          volumeMounts:
            - {name: repo, subPath: scripts/serve_dashboard.py, mountPath: /repo/scripts/serve_dashboard.py, readOnly: true}
            - {name: repo, subPath: src/harbortrace, mountPath: /repo/src/harbortrace, readOnly: true}
            - {name: repo, subPath: dashboard, mountPath: /repo/dashboard, readOnly: true}
            - {name: deps, mountPath: /deps, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: repo
          hostPath: {path: "@REPO@", type: Directory}
        - name: deps
          emptyDir: {}
---
# Address on the node: 127.0.0.1:30050 (or: kubectl -n harbortrace port-forward svc/dashboard 8050:8050)
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: harbortrace
spec:
  type: NodePort
  selector: {app: dashboard}
  ports:
    - {name: http, port: 8050, targetPort: http, nodePort: 30050}
